name: MyiOSApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MyiOSApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # XcodeGen 会在生成工程时自动写出这个 Info.plist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MyiOSApp
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MyiOSApp
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
